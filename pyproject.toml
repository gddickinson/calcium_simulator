[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcium-simulator"
version = "0.1.0"
description = "Interactive 2D intracellular calcium dynamics simulator"
requires-python = ">=3.9"
dependencies = [
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
]

[project.scripts]
calcium-simulator = "main:main"
